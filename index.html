<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <title>Тест на повышение группы</title>
    <link rel="stylesheet" href="style.css?v=2">

</head>
<body>

<div class="app">
    <div id="lock-screen" style="position: fixed; inset: 0; background: #0f172a; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; z-index: 2000; text-align: center;">
        <h2 style="margin: 0 0 8px 0; font-size: 22px; color: #f8fafc;">🔒 Доступ закрыт</h2>
        <p style="margin: 0 0 20px 0; font-size: 14px; color: #94a3b8;">Введите пароль для входа в тренажер</p>
        <input type="password" id="pass-in" placeholder="Пароль..." inputmode="numeric" style="max-width: 280px; width: 100%; padding: 14px; text-align: center; font-size: 20px; letter-spacing: 3px; margin-bottom: 12px; border-radius: 10px; border: 2px solid #334155; background: #1e293b; color: #fff;">
        <button id="pass-btn" style="width: 100%; max-width: 280px; padding: 14px; background: #2563eb; color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer;">Войти</button>
        <div id="pass-err" style="color: #ef4444; font-size: 14px; margin-top: 10px; min-height: 20px;"></div>
    </div>

    <div class="top-bar">
        <button class="lvl-btn active" data-lvl="1">Ур. 1</button>
        <button class="lvl-btn" data-lvl="2">Ур. 2</button>
        <button class="lvl-btn" data-lvl="3">Ур. 3</button>
        <button class="lvl-btn" data-lvl="4">Ур. 4</button>
    </div>

    <div id="menu-screen" class="grid"></div>

    <div id="quiz-screen" class="quiz-screen">
        <div class="quiz-header">
            <button id="back-btn" class="back-btn">← К разделам</button>
            <span id="q-counter">1 / 10</span>
        </div>
        <div class="q-text" id="q-text"></div>
        <div class="options" id="options"></div>
        <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        navigator.serviceWorker.register('./sw.js');
    }
</script>
    </div>
</div>

<script src="questions.js"></script>
<script src="app.js"></script>
<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js');
    }
</script>
</body>
</html>
